plugins {
    id 'com.android.application'
}

android {
    namespace 'com.monag.closedcode.agent'
    compileSdk 34

    defaultConfig {
        applicationId 'com.monag.closedcode.agent'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0-dev'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
