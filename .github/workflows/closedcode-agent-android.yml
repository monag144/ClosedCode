name: ClosedCode Agent Android APK

on:
  push:
    branches:
      - closedcode/mcp-apk-implementation-20260916
    paths:
      - 'closedcode_agent_android/**'
      - '.github/workflows/closedcode-agent-android.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34 platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Build debug APK
        shell: bash
        run: gradle -p closedcode_agent_android --no-daemon assembleDebug

      - name: Verify package artifact
        shell: bash
        run: |
          test -f closedcode_agent_android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum closedcode_agent_android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClosedCode-Agent-debug
          path: closedcode_agent_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
